            name:
              type: "string"
            cap_usd_micro:
              type: "integer"
              description: "The Budget's amount, in micro-USD."
            spent_usd_micro:
              type: "integer"
              description: "What the Budget spent, in micro-USD."
            remaining_usd_micro:
              type: "integer"
              description: "The smallest remainder across the Budget and every Budget that pays for it, in micro-USD."
            currency:
              type: "string"
        usage:
          type: "object"
          description: "On a read of one experiment whose runs hold the experiment's Key: what Lux recorded of the calls made with it. unattributed counts the calls no trial claims by its request label or a submitted request id, which count toward the experiment and no trial. read_to is how far the records were read."
