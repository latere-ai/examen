openapi: 3.1.0
info:
  title: Examen
  version: "1"
  summary: Experiments on agents and on programs built on models, with every number's noise and confounds stated.
  description: |
    A client applies tasks, suites, candidates and the metrics and graders
    they are measured by, runs experiments over them, and reads cells,
    trials, measurements and comparisons that come back already computed.
    Every route but this document takes a bearer token of an issuer the
    server trusts, and every route asks the server's authorizer before it
    acts. An object the caller may not see reads as a missing one.

    This document describes the routes the running release serves; a route
    of a later build step is added in the release that serves it.

    Every error is one object: a `code` to branch on, a fixed `message`
    for a person, and `details` for a developer. A request with a member
    this document does not describe is `400 unknown_field`, a body longer
    than the request bound is `413 request_too_large`, and every `429`
    carries `Retry-After` in whole seconds. A list answers
    `{"items": [...], "next_cursor": "..."}`, with `next_cursor` absent on
    the last page. A create that takes an `Idempotency-Key` answers a
    repeat of the same key and body with the first response and
    `Idempotent-Replayed: true`.

    The probes `GET /livez`, `GET /readyz` and `GET /version` sit outside
    the base path on the same listener and take no token.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /v1
    description: The base path, EXAMEN_BASE_PATH.
security:
  - bearer: []
tags:
  - name: contract
    description: This document.
  - name: metrics
  - name: graders
  - name: tasks
  - name: suites
  - name: candidates
  - name: baselines
  - name: taxonomies
  - name: experiments
  - name: trials
  - name: comparisons
paths:
  /openapi.yaml:
    get:
      tags: [contract]
      operationId: getOpenAPI
      summary: Read this document
      description: |
        The contract of the release that serves it, as OpenAPI 3.1 in YAML.
        It takes no token and asks the authorizer nothing.
      security: []
      responses:
        "200":
          description: This document.
          content:
            application/yaml:
              schema: {type: string}
  "/metrics/{ref}":
    put:
      tags:
        - "metrics"
      operationId: "applyMetric"
      summary: "Apply a metric version"
      description: "Applies the body as a version of the name in the path. A digest that is not yet a version of the name is stored and made current, `201`; one that already is makes that version current again and stores nothing, `200`. `If-Match: \"<digest>\"` applies only while that digest is current, `If-None-Match: *` only while the name has no version. Asks `metric.apply`."
      parameters:
        - name: "ref"
          in: "path"
          required: true
          description: "The name."
          schema:
            type: "string"
        - name: "owner"
          in: "query"
          description: "The owner context, a rendered subject percent-encoded as one segment."
          schema:
            type: "string"
        - name: "If-Match"
          in: "header"
          schema:
            type: "string"
          description: "The quoted digest that must be current."
        - name: "If-None-Match"
          in: "header"
          schema:
            type: "string"
            enum:
              - "*"
          description: "Applies only while the name has no version."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Metric"
      responses:
        "201":
          description: "A new version."
          headers:
            ETag:
              schema:
                type: "string"
              description: "The quoted digest."
            Location:
              schema:
                type: "string"
              description: "The version as name@digest."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Version"
        "400":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "412":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
        "422":
          "$ref": "#/components/responses/Error"
        "200":
          description: "The version the digest already was, current again."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Version"
    get:
      tags:
        - "metrics"
      operationId: "getMetric"
      summary: "Read one metric version"
      description: "By a name (its current version), name@digest, a digest, or an id. Asks `metric.read`."
      parameters:
        - name: "owner"
          in: "query"
          description: "The owner context, a rendered subject percent-encoded as one segment."
          schema:
            type: "string"
      responses:
        "200":
          description: "The version."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Version"
        "404":
          "$ref": "#/components/responses/Error"
    parameters:
      - name: "ref"
        in: "path"
        required: true
        description: "A name, name@digest, a digest, or an id."
        schema:
          type: "string"
  "/metrics/{name}/versions":
    get:
      tags:
        - "metrics"
      operationId: "listMetricVersions"
      summary: "List every version of one metric"
      description: "Newest first. Asks `metric.read`."
      parameters:
        - name: "name"
