      description: "Hands out pending trials of the named candidate, or of every external candidate when the body names none, within each cell's share of the parallelism and never more at once than the parallelism, smoke trials first and main trials only after a cell's smoke passes, in the order the experiment's scheduling deals them, for EXTERNAL_LEASE. Each trial names the candidate it runs. `204` when nothing may be leased now. No answer carries a reference. With a key source, a lease and a renewal also carry the experiment's Key as model_key, asked of the key source before any trial is taken, and each trial the label its model calls send as Lux-Labels: a key source that refuses answers 403 forbidden with its reason, one with no money left 422 budget_refused, and one that does not answer 503 owner_tokens_unavailable, each taking no trial. Asks `trial.lease`, with the candidate and its harness when the body names one."
