        - "outcome"
        - "started_at"
        - "agent_ended_at"
      additionalProperties: false
    Import:
      type: "object"
      properties:
        executor:
          type: "string"
          enum:
            - "external"
            - "topos"
            - "cella"
        task:
          type: "string"
        candidate:
          type: "string"
        executor_ref:
          type: "string"
        ended_at:
          type: "string"
          format: "date-time"
        outcome:
          type: "string"
          enum:
            - "completed"
            - "declined"
            - "timed_out"
            - "turn_limit"
            - "over_budget"
            - "infra_failed"
        failure:
          type: "object"
          properties:
            code:
              type: "string"
            detail:
              type: "string"
          required:
            - "code"
          additionalProperties: false
        started_at:
          type: "string"
          format: "date-time"
        agent_ended_at:
          type: "string"
          format: "date-time"
        outputs:
          type: "array"
          items:
            type: "object"
            properties:
              path:
                type: "string"
              arca:
                type: "object"
                properties:
                  path:
                    type: "string"
                  digest:
                    type: "string"
                required:
                  - "path"
                  - "digest"
                additionalProperties: false
            required:
              - "path"
              - "arca"
            additionalProperties: false
        lux_requests:
          type: "array"
          items:
            type: "string"
        service_versions:
          type: "object"
          additionalProperties:
            type: "string"
        service_usage:
          type: "object"
          additionalProperties:
            type: "object"
            properties:
              cost_usd_micro:
                type: "integer"
              units:
                type: "object"
                additionalProperties:
                  type: "number"
            required:
              - "cost_usd_micro"
            additionalProperties: false
        declared:
          type: "object"
          properties:
            harness_version:
              type: "string"
            image:
              type: "string"
          additionalProperties: false
        measurements:
          type: "array"
          items:
            type: "object"
            properties:
              metric:
                type: "string"
              value: {}
              rationale:
                type: "string"
            required:
              - "metric"
              - "value"
            additionalProperties: false
        ref:
          type: "string"
      required:
        - "executor"
        - "task"
        - "candidate"
        - "outcome"
        - "started_at"
        - "agent_ended_at"
        - "ended_at"
        - "declared"
      additionalProperties: false
    ComparisonRequest:
      type: "object"
      properties:
        experiment:
          type: "string"
        candidate:
          type: "string"
        baseline:
          type: "string"
        reference_candidate:
          type: "string"
        variable:
          type: "string"
          enum:
            - "agent"
            - "model"
            - "reasoning"
            - "tools"
            - "environment"
            - "workspace"
            - "task"
        task:
          type: "string"
        reference_task:
          type: "string"
      required:
        - "experiment"
        - "candidate"
      additionalProperties: false
    Interval:
      description: "An interval, [low, high], at CONFIDENCE_LEVEL."
      type: "array"
      minItems: 2
      maxItems: 2
      items:
        type: "number"
    LabelShare:
      type: "object"
      description: "One label's count and proportion in a distribution, with the proportion's interval."
      properties:
        label:
          type: "string"
        count:
          type: "integer"
        proportion:
          type: "number"
        interval:
          "$ref": "#/components/schemas/Interval"
        unmapped:
          type: "boolean"
          description: "A raw label of an open vocabulary the taxonomy record read does not map."
      required:
        - "label"
        - "count"
        - "proportion"
    Summary:
      type: "object"
      description: "One metric over one set of trials: a cell, or a candidate's tasks at suite level."
      properties:
        aggregate:
          type: "string"
          description: "The metric's aggregate; absent for a candidate-level metric."
          enum:
            - "rate"
            - "mean"
            - "median"
            - "p90"
            - "distribution"
            - "repeat_rate"
            - "mode_share"
            - "distinct_count"
        n:
          type: "integer"
          description: "The finished trials of the set that the metric applies to."
        not_applicable:
          type: "integer"
          description: "The finished trials outside the metric's applies_to, in neither n nor missing."
        value:
          description: "The rate, mean, median or p90; for distribution, an object from each label to its share; for repeat_rate, mode_share and distinct_count, the statistic; for a candidate-level metric, its one current value. Absent when nothing is valued."
        numerator:
          type: "integer"
          description: "For rate, the finished trials whose value is true; for mode_share, the trials holding the most frequent label."
        denominator:
          type: "integer"
          description: "The finished trials holding a current value of the metric, less those exclude_labels leaves out."
        excluded_labels:
          type: "object"
          description: "For a cell-level metric, the valued trials its exclude_labels left out, by label."
          additionalProperties:
            type: "integer"
        missing:
          type: "integer"
          description: "n less denominator, and for a cell-level metric less the trials excluded_labels counts."
        interval:
          "$ref": "#/components/schemas/Interval"
        no_interval:
          type: "string"
          description: "When interval is absent, one plain sentence saying why."
        mean:
          type: "number"
        sd:
          type: "number"
        min:
          type: "number"
        max:
          type: "number"
        distribution:
          type: "array"
          description: "For a label metric, each label's count and proportion."
          items:
            "$ref": "#/components/schemas/LabelShare"
        mode:
          type: "string"
          description: "For a label metric, its most frequent label."
        unmapped:
          type: "integer"
          description: "For an open-vocabulary metric, the finished trials whose raw label the taxonomy record read does not map."
        tasks:
          type: "integer"
          description: "At suite level, the number of tasks included."
        coverage:
          type: "number"
          description: "At suite level, the share of the suite's weight the included tasks hold."
        excluded:
          type: "object"
          description: "The trials of the set not counted in n, by reason: retried, infra_failed, over_budget, canceled or not_done."
          additionalProperties:
            type: "integer"
        final:
          type: "boolean"
          description: "True once every declared trial of the set is done and graded; false while the figure can still change."
      required:
        - "n"
        - "not_applicable"
        - "denominator"
        - "missing"
        - "final"
    LeftOut:
      type: "object"
      description: "A task of weight above zero that a suite-level result does not include, with each side's valued trials."
      properties:
        task:
          type: "string"
        why:
          type: "string"
          enum:
            - "unpaired"
            - "too_few_trials"
        candidate:
          type: "integer"
        reference:
          type: "integer"
      required:
        - "task"
        - "why"
        - "candidate"
        - "reference"
    Confound:
      type: "object"
      description: "One confound of a result: a field besides the variable compared in which the two sides differ, or a condition of the trials the result read."
      properties:
        name:
          type: "string"
        tasks:
          type: "array"
          description: "On a suite-level result, the task names it applies to."
          items:
            type: "string"
        candidate:
          description: "Per side: a count of requests or trials, a window {from, to}, or a taxonomy record id, by the confound's name; absent for a tuple field."
        reference:
          description: "As candidate, for the reference side."
        grader:
          type: "string"
          description: "For uncalibrated, the judge version whose calibration the result read."
      required:
        - "name"
    Result:
      type: "object"
      description: "One result of a comparison, as the analysis computed it."
      properties:
        level:
          type: "string"
          description: "task, over one task's cells; suite, over the paired tasks it includes; or candidate, a candidate-level metric's one value per side, which is descriptive."
          enum:
            - "task"
            - "suite"
            - "candidate"
        metric:
          type: "string"
          description: "The metric's digest."
        metric_name:
          type: "string"
        direction:
          type: "string"
          enum:
            - "higher_is_better"
            - "lower_is_better"
            - "none"
        task:
          type: "string"
          description: "On a task-level result, the task's name; for a comparison across tasks, both names joined by ` vs `; for a declared comparison of the general form, its stratum's name."
        task_digests:
          type: "object"
          description: "On a task-level result, each side's task digest."
          properties:
            candidate:
              type: "string"
            reference:
              type: "string"
          required:
            - "candidate"
            - "reference"
        candidate:
          "$ref": "#/components/schemas/Summary"
        reference:
          "$ref": "#/components/schemas/Summary"
        delta:
          description: "The change, candidate less reference: a number, or for a label metric an object from each label to the difference of its proportions."
          oneOf:
            - type: "number"
            - type: "object"
              additionalProperties:
                type: "number"
        delta_kind:
          type: "string"
          enum:
            - "difference"
            - "per_label"
        delta_interval:
          description: "The delta's interval at CONFIDENCE_LEVEL, for per_label an object from each label to its interval; absent where none is computed."
          oneOf:
            - "$ref": "#/components/schemas/Interval"
            - type: "object"
              additionalProperties:
                "$ref": "#/components/schemas/Interval"
        no_delta_interval:
          type: "string"
          description: "When delta_interval is absent on a result that is not insufficient, one plain sentence saying why."
        method:
          type: "string"
          description: "The test: boschloo_exact, permutation, stratified_permutation, fisher_freeman_halton or chi_square_permutation; absent on a descriptive result."
        statistic:
          type: "string"
          description: "The statistic the test orders by: fisher_p, welch_t, studentized_quantile, difference, table_probability, pearson_x2 or pearson_x2_sum; absent on a descriptive result."
        exact:
          type: "boolean"
          description: "Whether the test enumerated every case."
        resamples:
          type: "integer"
          description: "How many relabelings or tables the test enumerated or drew; absent for boschloo_exact."
        seed:
          type: "string"
          description: "This result's derived seed, hex."
        p:
          type: "number"
          description: "The uncorrected p-value."
        q:
          type: "number"
          description: "The value after the correction at FALSE_DISCOVERY_RATE."
        h:
          type: "number"
          description: "On a pair result of two benchmark entries, the Holm-adjusted value, in place of q; absent on a comparison's result."
        verdict:
          type: "string"
          description: "Absent on a descriptive result."
          enum:
            - "improved"
            - "regressed"
            - "changed"
            - "within_noise"
            - "insufficient"
        reason:
          type: "string"
          description: "One plain sentence saying why the verdict is what it is."
        left_out:
          type: "array"
          description: "On a suite-level result, each task of weight above zero the result does not include."
          items:
            "$ref": "#/components/schemas/LeftOut"
        confounds:
          type: "array"
          items:
            "$ref": "#/components/schemas/Confound"
      required:
        - "level"
        - "metric"
        - "metric_name"
        - "direction"
        - "candidate"
        - "reference"
        - "reason"
    Window:
      type: "object"
      description: "A side's time window: the earliest started_at and the latest ended_at of the trials read."
      properties:
        from:
          type: "string"
          format: "date-time"
        to:
          type: "string"
          format: "date-time"
      required:
        - "from"
        - "to"
    Windows:
      type: "object"
      description: "Each side's window over every trial the comparison read; a side that read none has none."
      properties:
        candidate:
          "$ref": "#/components/schemas/Window"
        reference:
          "$ref": "#/components/schemas/Window"
    UnpairedTasks:
      type: "object"
      description: "The task names one side holds alone."
      properties:
        candidate_only:
          type: "array"
          items:
            type: "string"
        reference_only:
          type: "array"
          items:
            type: "string"
      required:
        - "candidate_only"
        - "reference_only"
    Correction:
      type: "object"
      description: "The correction applied to the comparison's p-values."
      properties:
        method:
          type: "string"
          description: "benjamini_hochberg."
        primary:
          type: "string"
          description: "The digest of the metric whose primary result is out of the family, tested alone and reported uncorrected, or for a declared comparison corrected in the declared family; absent on an exploratory comparison."
        family:
          type: "integer"
          description: "How many p-values the one corrected family held."
        declared:
          type: "integer"
          description: "On a declared comparison, the size of the declared family its primary result is corrected in."
      required:
        - "method"
        - "family"
    Resamples:
      type: "object"
      description: "PERMUTATION_RESAMPLES as resolved for the primary result and for the family."
      properties:
        primary:
          type: "integer"
        family:
          type: "integer"
      required:
        - "primary"
        - "family"
    Parameters:
      type: "object"
      description: "The values the comparison was computed with."
      properties:
        false_discovery_rate:
          type: "number"
        confidence_level:
          type: "number"
        min_trials_for_verdict:
          type: "integer"
        min_trials_per_task_in_suite:
          type: "integer"
        min_suite_coverage:
          type: "number"
        min_trials_for_p90_interval:
          type: "integer"
        bootstrap_resamples:
          type: "integer"
        permutation_exact_max:
          type: "integer"
        permutation_stop_exceedances:
          type: "integer"
        boschloo_grid_points:
          type: "integer"
        tie_tolerance:
          type: "number"
        window_tolerance:
          type: "string"
          description: "A duration, such as 24h0m0s."
        permutation_resamples:
          "$ref": "#/components/schemas/Resamples"
    Comparison:
      type: "object"
      properties:
        id:
          type: "string"
        owner:
          type: "string"
        experiment:
          type: "string"
        candidate:
          type: "string"
          description: "The candidate's digest."
        baseline:
          type: "string"
          description: "The baseline record the reference side reads, when it is one."
        reference_candidate:
          type: "string"
          description: "The reference candidate's digest, when the reference side is a candidate."
        task:
          type: "string"
          description: "For a comparison across tasks, the candidate's task."
        reference_task:
          type: "string"
          description: "For a comparison across tasks, the reference task."
        automatic:
          type: "boolean"
          description: "True for the comparison Examen keeps of a candidate against its experiment's reference."
        declared:
          type: "integer"
          description: "For a comparison its experiment declared, its position in the experiment's comparisons; absent otherwise."
        declaration:
          description: "For a declared comparison of the general form, its declaration: the cell variable it compares, its two levels, where and by, and the metric of its primary result."
          type: "object"
          properties:
            variable:
              type: "string"
            levels:
              type: "array"
              items:
                type: "string"
            where:
              type: "object"
              additionalProperties:
                type: "string"
            by:
              type: "array"
              items:
                type: "string"
            metric:
              type: "string"
          additionalProperties: false
        exploratory:
          type: "boolean"
          description: "True for a comparison computed on request, and for an automatic one against a reference set after a cell left pending: it is never headlined."
        state:
          type: "string"
          enum:
            - "computing"
            - "complete"
            - "failed"
        final:
          type: "boolean"
          description: "True once both sides are final; false while a figure can still change."
        variable:
          type: "array"
          description: "The tuple fields the comparison intends to vary."
          items:
            type: "string"
        declared_provenance:
          type: "array"
          description: "The sides, candidate and reference, whose candidate is of kind external, so whose tuple its harness declared."
          items:
            type: "string"
        single_variable:
          type: "boolean"
          description: "No tuple field besides variable differs on any paired task; absent until computed."
        confounds:
          type: "array"
          description: "The name of every confound of its results."
          items:
            type: "string"
        results:
          type: "array"
          description: "Its results; GET /comparisons/{id} answers the suite-level and candidate-level ones, and /rows the task-level ones."
          items:
            "$ref": "#/components/schemas/Result"
        taxonomies:
          type: "object"
          description: "For each open-vocabulary metric it reads, the id of the taxonomy record its canonical labels were read at."
          additionalProperties:
            type: "string"
        unpaired_tasks:
          "$ref": "#/components/schemas/UnpairedTasks"
        candidate_suite:
          type: "object"
          description: "Per metric, the candidate's own suite-level summary over the tasks of its suite with weight greater than zero."
          additionalProperties:
            "$ref": "#/components/schemas/Summary"
        windows:
          "$ref": "#/components/schemas/Windows"
        verdict_counts:
          type: "object"
          description: "Per metric, the number of task-level results with each verdict."
          additionalProperties:
            type: "object"
            additionalProperties:
              type: "integer"
        correction:
          "$ref": "#/components/schemas/Correction"
        analysis_version:
          type: "string"
          description: "examen.analysis/v1."
        parameters:
          "$ref": "#/components/schemas/Parameters"
        inputs_digest:
          type: "string"
          description: "The digest of its inputs document."
        seed:
          type: "string"
          description: "The root seed, hex."
        computed_at:
          type: "string"
          format: "date-time"
        created_at:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "experiment"
        - "candidate"
        - "automatic"
        - "exploratory"
        - "state"
        - "final"
    DeclaredAnalysis:
      type: "object"
      properties:
        experiment:
          type: "string"
        final:
          type: "boolean"
        family:
          type: "object"
          properties:
            method:
              type: "string"
            size:
              type: "integer"
            level:
              type: "number"
          additionalProperties: false
        comparisons:
          type: "array"
          items:
            type: "object"
            properties:
              index:
                type: "integer"
              comparison:
                type: "string"
              metric:
                type: "string"
              p:
                type: "number"
              q:
                type: "number"
              verdict:
                type: "string"
              reason:
                type: "string"
              final:
                type: "boolean"
            required:
              - "index"
              - "metric"
              - "reason"
              - "final"
            additionalProperties: false
        independence:
          description: "The experiment's test of independence when it declares one: its declaration, its levels, their summaries, its strata, the test and its p, verdict and reason; before any cell holds a finished trial, its declaration, levels and reason alone."
          type: "object"
        computed_at:
          type: "string"
          format: "date-time"
      required:
        - "experiment"
        - "final"
        - "family"
        - "comparisons"
      additionalProperties: false
    Grid:
      type: "object"
      properties:
        experiment:
          type: "string"
        state:
          type: "string"
        reference:
          type: "object"
          properties:
            baseline:
              type: "string"
            candidate:
              type: "string"
          additionalProperties: false
        metric:
          type: "object"
          properties:
            digest:
              type: "string"
            name:
              type: "string"
            type:
              type: "string"
            aggregate:
              type: "string"
            direction:
              type: "string"
          additionalProperties: false
        candidates:
          type: "array"
          items:
            type: "object"
            properties:
              digest:
                type: "string"
              name:
                type: "string"
            additionalProperties: false
        items:
          type: "array"
          items:
            type: "object"
            properties:
              task:
                type: "object"
                properties:
                  name:
                    type: "string"
                  digest:
                    type: "string"
                additionalProperties: false
              reference_summary:
                type: "object"
              cells:
                type: "array"
                items:
                  type: "object"
                  properties:
                    cell:
                      type: "string"
                    candidate:
                      type: "string"
                    state:
                      type: "string"
                    parked_reason:
                      type: "string"
                    trials:
                      type: "object"
                      properties:
                        declared:
                          type: "integer"
                        pending:
                          type: "integer"
                        running:
                          type: "integer"
                        checking:
                          type: "integer"
                        done:
                          type: "integer"
                        retried:
                          type: "integer"
                        outcomes:
                          type: "object"
                          additionalProperties:
                            type: "integer"
                      additionalProperties: false
                    summary:
                      type: "object"
                    verdict:
                      type: "string"
                    reason:
                      type: "string"
                    comparison:
                      type: "string"
                  additionalProperties: false
            additionalProperties: false
        next_cursor:
          type: "string"
      required:
        - "experiment"
        - "state"
        - "metric"
        - "candidates"
        - "items"
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: {$ref: "#/components/schemas/Error"}
    Error:
      type: object
      required: [code, message, details]
      additionalProperties: false
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message:
          type: string
          description: The one sentence a person reads, the same for every occurrence of the code.
        details: {$ref: "#/components/schemas/ErrorDetails"}
    ErrorDetails:
      type: object
      required: [retryable]
      additionalProperties: false
      properties:
        detail:
          type: string
          description: The developer detail, on every error but `internal`.
        retryable:
          type: boolean
          description: Whether the same request may succeed later unchanged.
        field:
          type: string
          description: The member or parameter the error is about, as a dotted path with indexes.
        constant:
          type: string
          description: The limit a request exceeds, on `limit_exceeded`.
        reason:
          type: string
          description: One snake_case word for this instance.
        figure:
          type: number
          description: The figure a limit holds, on a `forbidden` a limit made.
        state:
          type: string
          description: The object's state, on a conflict with it.
        fields:
          type: array
          items: {type: string}
          description: The fields that differ or are not pinned, on `provenance_mismatch`.
        core:
          type: string
          enum: [topos, cella, lux, arca, origo]
          description: The core an error is about.
    ErrorCode:
      type: string
      description: Every code a client branches on.
      enum:
            - invalid_request
            - unknown_field
            - missing_field
            - invalid_field
            - invalid_cursor
            - missing_token
            - invalid_token
            - forbidden
            - sign_in_not_kept
            - not_found
            - metric_not_found
            - grader_not_found
            - task_not_found
            - suite_not_found
            - candidate_not_found
            - experiment_not_found
            - cell_not_found
            - trial_not_found
            - measurement_not_found
            - baseline_not_found
            - comparison_not_found
            - bar_not_found
            - evaluation_not_found
            - export_not_found
            - share_not_found
            - report_not_found
            - taxonomy_not_found
            - publication_not_found
            - submission_not_found
            - annotation_not_found
            - immutable_field
            - experiment_finished
            - experiment_not_complete
            - experiment_canceled
            - experiment_not_finished
            - experiment_is_baseline
            - experiment_adopted_from
            - cell_not_parked
            - comparison_not_complete
            - narrative_has_findings
            - wrong_mode
            - cell_full
            - source_not_finished
            - already_imported
            - already_annotated
            - lease_expired
            - lease_not_held
            - publication_exists
            - version_not_published
            - publication_listed
            - submissions_closed
            - report_not_shared
            - submission_decided
            - benchmark_full
            - benchmark_not_reviewed
            - owner_has_entry
            - idempotency_key_reused
            - request_in_progress
