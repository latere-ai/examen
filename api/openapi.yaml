  "/experiments":
    post:
      tags:
        - "experiments"
      operationId: "createExperiment"
      summary: "Create an experiment"
      description: "Resolves the suite and the candidates in the owner context and stores the experiment `pending`, with every cell in mode `execute`. Candidates of kind `external` and `topos` run; a candidate of kind `program` is `422 executor_unavailable`. A `topos` candidate needs an installation that starts Topos sessions, else `422 core_not_configured`; one that names `tools`, and a task it runs that names an environment or an Arca workspace, are `422 executor_unavailable`, and a task it runs without an instruction is `422 missing_field`. Checks and model judges grade the trials of an experiment in mode `execute` whose candidates are all `topos`: on any other experiment they are `422 executor_unavailable`, and on an installation without Cella for checks or Lux for judges, `422 core_not_configured`. A judge of level `candidate`, a canonicalizer and a configured decline judge are `422 executor_unavailable`, or `422 core_not_configured` without Lux; an agent judge is `422 core_not_configured`; and so are an `execute` task with inputs, and a cap no authorizer answered with a Budget. With no `owner` parameter, asks `experiment.list` for the owner context its allow names, then `experiment.create`."
      parameters:
        - name: "owner"
          in: "query"
          description: "The owner context, a rendered subject percent-encoded as one segment."
          schema:
            type: "string"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExperimentCreate"
      responses:
        "201":
          description: "The experiment."
          headers:
            Location:
              schema:
                type: "string"
              description: "The experiment's address."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Experiment"
        "400":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
        "422":
          "$ref": "#/components/responses/Error"
    get:
      tags:
        - "experiments"
      operationId: "listExperiments"
      summary: "List experiments"
      description: "Newest first. Asks `experiment.list`."
      parameters:
        - name: "owner"
          in: "query"
          description: "The owner context, a rendered subject percent-encoded as one segment."
          schema:
            type: "string"
        - name: "suite"
          in: "query"
          description: "A suite digest, or a name for every version of it."
          schema:
            type: "string"
        - name: "candidate"
          in: "query"
          description: "A candidate digest."
          schema:
            type: "string"
        - name: "state"
          in: "query"
          description: "A state."
          schema:
            type: "string"
        - name: "mode"
          in: "query"
          description: "execute or import."
          schema:
            type: "string"
        - name: "baseline"
          in: "query"
          description: "A baseline record id the reference names."
          schema:
            type: "string"
        - name: "metadata.<key>"
          in: "query"
          description: "One metadata pair."
          schema:
            type: "string"
        - "$ref": "#/components/parameters/Limit"
        - "$ref": "#/components/parameters/Cursor"
      responses:
        "200":
          description: "A page of experiments."
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "items"
                properties:
                  items:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/Experiment"
                  next_cursor:
                    type: "string"
                    description: "Absent on the last page."
        "400":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
