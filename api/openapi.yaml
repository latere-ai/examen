          description: "An opaque value the client's installation gave it for this create, such as a handle to a sign-in the installation keeps for the experiment. Examen passes it to the authorizer as sign_in on experiment.create and keeps it nowhere: it is not stored on the experiment, answered, logged or sent in an event."
          type: "string"
          minLength: 1
          maxLength: 255
        comparisons:
          description: "The comparisons the experiment declares it will make, at most MAX_DECLARED_COMPARISONS: a pair of candidates with an optional variable; one candidate's two tasks by name or digest; or the general form, a cell variable, its two levels, and optional where and by. Each form takes an optional metric. Each is computed without being asked and is not exploratory, and their primary results are corrected together. Fixed at create."
          type: "array"
          maxItems: 128
          items:
            type: "object"
            properties:
              candidate:
                type: "string"
              reference_candidate:
                type: "string"
              variable:
                type: "string"
                description: "On a pair of candidates, one logical variable: agent, model, reasoning, tools, environment or workspace. In the general form, the cell variable compared: candidate, task, model, reasoning or a task factor's name."
              task:
                type: "string"
              reference_task:
                type: "string"
              levels:
                description: "The general form: the variable's two levels, the candidate side's first. A candidate's level is its digest and a task's its name or digest."
                type: "array"
                minItems: 2
                maxItems: 2
                items:
                  type: "string"
              where:
                description: "The general form: cell variables each held to one level."
                type: "object"
                additionalProperties:
                  type: "string"
              by:
                description: "The general form: the cell variables the comparison is stratified by; without it, each side is one cell."
                type: "array"
                items:
                  type: "string"
              metric:
                description: "The metric whose result is the comparison's primary result, by name or digest; the suite's primary metric when absent."
                type: "string"
            additionalProperties: false
        independence:
          description: "The experiment's test of independence: a trial-level label metric of the suite, by name or digest, against a cell variable, `candidate` when absent, stratified by the cell variables of `by`, over the cells `where` selects. `by` is `[\"task\"]` when absent for a variable of the candidate and `[\"candidate\"]` for the task or a factor. Fixed at create."
          type: "object"
          properties:
            metric:
              type: "string"
            variable:
              type: "string"
            by:
              type: "array"
              items:
                type: "string"
            where:
              type: "object"
              additionalProperties:
                type: "string"
          required:
            - "metric"
          additionalProperties: false
        scheduling:
          type: "string"
          description: "How the experiment's cells take its parallelism and its external trials are leased: `task_by_task`, the default, a task's cells before the next task's, or `interleaved`, every cell of every task in turn, so trial i of every cell runs in one window. Fixed at create."
          enum:
            - "task_by_task"
            - "interleaved"
        metadata:
          type: "object"
          additionalProperties:
            type: "string"
      required:
        - "suite"
        - "candidates"
        - "budget"
      additionalProperties: false
