          type: "object"
          properties:
            metric:
              type: "string"
            variable:
              type: "string"
            by:
              type: "array"
              items:
                type: "string"
            where:
              type: "object"
              additionalProperties:
                type: "string"
          required:
            - "metric"
          additionalProperties: false
        scheduling:
          type: "string"
          enum:
            - "task_by_task"
            - "interleaved"
        comparisons:
          description: "The comparisons the experiment declared at create, each candidate and task by digest."
          type: "array"
          maxItems: 128
          items:
            type: "object"
            properties:
              candidate:
                type: "string"
              reference_candidate:
                type: "string"
              variable:
                type: "string"
                description: "On a pair of candidates, one logical variable: agent, model, reasoning, tools, environment or workspace. In the general form, the cell variable compared: candidate, task, model, reasoning or a task factor's name."
              task:
                type: "string"
              reference_task:
                type: "string"
              levels:
                description: "The general form: the variable's two levels, the candidate side's first. A candidate's level is its digest and a task's its name or digest."
                type: "array"
                minItems: 2
                maxItems: 2
                items:
                  type: "string"
              where:
                description: "The general form: cell variables each held to one level."
                type: "object"
                additionalProperties:
                  type: "string"
              by:
                description: "The general form: the cell variables the comparison is stratified by; without it, each side is one cell."
                type: "array"
                items:
                  type: "string"
              metric:
                description: "The metric whose result is the comparison's primary result, by digest; absent when it is the suite's primary metric."
                type: "string"
            additionalProperties: false
        state:
          type: "string"
