      description: "Resolves the suite and the candidates in the owner context and stores the experiment `pending`, with every cell in mode `execute`. This release runs candidates of kind `external` alone: `topos` and `program` are `422 executor_unavailable`. A suite whose tasks have checks, or whose graders, decline judge or canonicalizers are model or agent judges, is `422 core_not_configured`, as is an `execute` task with inputs and a cap no authorizer answered with a Budget. Asks `experiment.create`."
