      description: "A `snapshot` frame first unless `Last-Event-ID` resumes, every event in sequence order, a `: keepalive` comment after silence, and `end` once the experiment is complete or canceled. It closes at the bearer's expiry, and with an `error` frame after a deny. Asks `experiment.read`."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The experiment's id."
          schema:
            type: "string"
        - name: "Last-Event-ID"
          in: "header"
          schema:
            type: "string"
          description: "The sequence to resume after."
      responses:
        "200":
          description: "The stream."
          content:
            text/event-stream:
              schema:
                type: "string"
        "400":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
