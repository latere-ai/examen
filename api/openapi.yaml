            - publication_withdrawn
            - publication_paused
            - request_too_large
            - unpinned_reference
            - reference_not_found
            - limit_exceeded
            - suite_mismatch
            - no_reference
            - not_in_experiment
            - provenance_mismatch
            - metric_not_declared
            - budget_refused
            - executor_unavailable
            - core_not_configured
            - image_not_admitted
            - credential_audience_reserved
            - file_store_not_download_only
