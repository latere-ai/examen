              schema:
                "$ref": "#/components/schemas/Experiment"
        "400":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "413":
