      type: "object"
      properties:
        experiment:
          type: "string"
        state:
          type: "string"
        reference:
          type: "object"
          properties:
            baseline:
              type: "string"
            candidate:
              type: "string"
          additionalProperties: false
        metric:
          type: "object"
          properties:
            digest:
              type: "string"
            name:
              type: "string"
            type:
              type: "string"
            aggregate:
              type: "string"
            direction:
              type: "string"
          additionalProperties: false
        candidates:
          type: "array"
          items:
            type: "object"
            properties:
              digest:
                type: "string"
              name:
                type: "string"
            additionalProperties: false
        items:
          type: "array"
          items:
            type: "object"
            properties:
              task:
                type: "object"
                properties:
                  name:
                    type: "string"
                  digest:
                    type: "string"
                additionalProperties: false
              reference_summary:
                type: "object"
              cells:
                type: "array"
                items:
                  type: "object"
                  properties:
                    cell:
                      type: "string"
                    candidate:
                      type: "string"
                    state:
                      type: "string"
                    parked_reason:
                      type: "string"
                    trials:
                      type: "object"
                      properties:
                        declared:
                          type: "integer"
                        pending:
                          type: "integer"
                        running:
                          type: "integer"
                        checking:
                          type: "integer"
                        done:
                          type: "integer"
                        retried:
                          type: "integer"
                        outcomes:
                          type: "object"
                          additionalProperties:
                            type: "integer"
                      additionalProperties: false
                    summary:
                      type: "object"
                    verdict:
                      type: "string"
                    reason:
                      type: "string"
                    comparison:
                      type: "string"
                  additionalProperties: false
            additionalProperties: false
        next_cursor:
          type: "string"
      required:
        - "experiment"
        - "state"
        - "metric"
        - "candidates"
        - "items"
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: {$ref: "#/components/schemas/Error"}
    Error:
      type: object
      required: [code, message, details]
      additionalProperties: false
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message:
          type: string
          description: The one sentence a person reads, the same for every occurrence of the code.
        details: {$ref: "#/components/schemas/ErrorDetails"}
    ErrorDetails:
      type: object
      required: [retryable]
      additionalProperties: false
      properties:
        detail:
          type: string
          description: The developer detail, on every error but `internal`.
        retryable:
          type: boolean
          description: Whether the same request may succeed later unchanged.
        field:
          type: string
          description: The member or parameter the error is about, as a dotted path with indexes.
        constant:
          type: string
          description: The limit a request exceeds, on `limit_exceeded`.
        reason:
          type: string
          description: One snake_case word for this instance.
        figure:
          type: number
          description: The figure a limit holds, on a `forbidden` a limit made.
        state:
          type: string
          description: The object's state, on a conflict with it.
        fields:
          type: array
          items: {type: string}
          description: The fields that differ or are not pinned, on `provenance_mismatch`.
        core:
          type: string
          enum: [topos, cella, lux, arca, origo]
          description: The core an error is about.
    ErrorCode:
      type: string
      description: Every code a client branches on.
      enum:
            - invalid_request
            - unknown_field
            - missing_field
            - invalid_field
            - invalid_cursor
            - missing_token
            - invalid_token
            - forbidden
            - sign_in_not_kept
            - not_found
            - metric_not_found
            - grader_not_found
            - task_not_found
            - suite_not_found
            - candidate_not_found
            - experiment_not_found
            - cell_not_found
            - trial_not_found
            - measurement_not_found
            - baseline_not_found
            - comparison_not_found
            - bar_not_found
            - evaluation_not_found
            - export_not_found
            - share_not_found
            - report_not_found
            - taxonomy_not_found
            - publication_not_found
            - submission_not_found
            - annotation_not_found
            - immutable_field
            - experiment_finished
            - experiment_not_complete
            - experiment_canceled
            - experiment_not_finished
            - experiment_is_baseline
            - experiment_adopted_from
            - cell_not_parked
            - comparison_not_complete
            - narrative_has_findings
            - wrong_mode
            - cell_full
            - source_not_finished
            - already_imported
            - already_annotated
            - lease_expired
            - lease_not_held
            - publication_exists
            - version_not_published
            - publication_listed
            - submissions_closed
            - report_not_shared
            - submission_decided
            - benchmark_full
