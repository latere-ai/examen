    ExperimentCreate:
      type: "object"
      properties:
        suite:
          type: "string"
        candidates:
          type: "array"
          items:
            type: "string"
        trials:
          type: "integer"
        budget:
          type: "object"
          properties:
            name:
              type: "string"
            cap_usd_micro:
              type: "integer"
          additionalProperties: false
        parallelism:
          type: "integer"
