            requests:
              type: "integer"
            cost_usd_micro:
              type: "integer"
              description: "The priced calls' cost, in micro-USD."
            unpriced_requests:
              type: "integer"
              description: "The calls Lux could not price, whose cost is unknown."
            unattributed:
              type: "object"
              properties:
                requests:
                  type: "integer"
                cost_usd_micro:
                  type: "integer"
                unpriced_requests:
                  type: "integer"
              additionalProperties: false
            read_to:
              type: "string"
              format: "date-time"
          additionalProperties: false
        parallelism:
          type: "integer"
        reference:
          type: "object"
