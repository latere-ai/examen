components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A token of an issuer EXAMEN_OIDC_ISSUERS names, addressed to an audience EXAMEN_OIDC_AUDIENCE names.
  parameters:
    Limit:
      name: limit
      in: query
      description: Items in a page, 50 when absent and 200 at most; a larger one is `400 invalid_field`.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the page before. Opaque; a cursor this list did not issue is `400 invalid_cursor`.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        1 to 255 bytes of visible ASCII. The same key from the same subject
        within 24 hours answers the first response again, with
        `Idempotent-Replayed: true`; the same key with another body is
        `409 idempotency_key_reused`, and one that arrives while the first
        is served is `409 request_in_progress`.
      schema: {type: string, minLength: 1, maxLength: 255}
  headers:
    RetryAfter:
      description: The seconds to wait before the same request may be admitted.
      schema: {type: integer, minimum: 1}
    RequestID:
      description: The request's id, the one the caller sent or one the server made.
      schema: {type: string}
  responses:
    Error:
      description: An error, in the one envelope every error has.
      headers:
        X-Request-Id: {$ref: "#/components/headers/RequestID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    TooManyRequests:
      description: A rate refused, with the time to wait.
      headers:
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
        X-Request-Id: {$ref: "#/components/headers/RequestID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    Version:
      type: "object"
      properties:
        id:
          type: "string"
        owner:
          type: "string"
        name:
          type: "string"
        digest:
          type: "string"
        current:
          type: "boolean"
        created_at:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "owner"
        - "name"
        - "digest"
        - "current"
        - "created_at"
      description: "A version: its kind's fields as applied, beside its record."
    Metric:
      type: "object"
      properties:
        name:
          type: "string"
        type:
          type: "string"
          enum:
            - "binary"
            - "score"
            - "count"
            - "duration"
            - "cost"
            - "label"
        range:
          type: "array"
          items:
            type: "number"
        vocabulary:
          type: "string"
          enum:
            - "closed"
            - "open"
        labels:
          type: "array"
          items:
            type: "string"
        direction:
          type: "string"
          enum:
            - "higher_is_better"
            - "lower_is_better"
            - "none"
        level:
          type: "string"
          enum:
            - "trial"
            - "cell"
            - "candidate"
        applies_to:
          type: "array"
          items:
            type: "string"
        of:
          type: "string"
        exclude_labels:
          type: "array"
          items:
            type: "string"
        aggregate:
          type: "string"
        unit:
          type: "string"
        description:
          type: "string"
      required:
        - "type"
        - "direction"
      additionalProperties: false
    Grader:
      type: "object"
      properties:
        name:
          type: "string"
        kind:
          type: "string"
          enum:
            - "check"
            - "model_judge"
            - "agent_judge"
            - "annotation"
        level:
          type: "string"
          enum:
            - "trial"
            - "candidate"
        produces:
          type: "array"
          items:
            type: "string"
        check:
          type: "object"
          properties:
            command:
              type: "array"
              items:
                type: "string"
            workdir:
              type: "string"
            env:
