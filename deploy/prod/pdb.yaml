# One of the 2 replicas may be evicted at a time, so a node drain leaves the
# other serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: examend
  labels:
    app.kubernetes.io/name: examend
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: examend
