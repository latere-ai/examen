# The account the core runs as. It holds no token of the cluster's API,
# since examend asks the cluster nothing, and pulls the private image with
# the namespace's pull secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: examend
  labels:
    app.kubernetes.io/name: examend
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-secret
