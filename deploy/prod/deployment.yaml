# examend serve, 2 replicas. The replicas hold no state of their own: every
# object, experiment, trial and event, and the work queue, is a row of the
# database, so they are interchangeable and a rollout replaces them one at a
# time with none missing.
#
# EXAMEN_OIDC_ISSUERS is auth alone. EXAMEN_OIDC_AUDIENCE: `examen` is the
# core's own audience, which the console's actor tokens name; `api.latere.ai`
# is the platform origin's, which a person's key and the command line name.
#
# The database: serve refuses a schema that lacks a migration the binary
# carries, so the init container runs `examend migrate` first, on
# EXAMEN_DATABASE_URL, the direct endpoint of the database examen, under the
# migrator's session lock, so 2 Pods starting at once apply each migration
# once; the cluster's connection budget holds a reserve for a starting Pod's
# migration. EXAMEN_DATABASE_POOL_URL is its transaction-mode pool, whose 2
# server connections, one per replica, are the core's line in that budget
# and carry all of its serving. Both are the keys terraform writes into
# examen-db, and the pool is required, because a Pod that served over the
# direct endpoint would take connections the budget does not hold.
#
# The authorizer's bearer is a file, the Secret examen-authorizer mounted
# read-only, and the key source's the Secret examen-keys. SSL_CERT_DIR appends platformd's internal CA to the system
# roots, so the decider's certificate verifies; the volume carries ca.crt
# alone, never the CA's key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: examend
  labels:
    app.kubernetes.io/name: examend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: examend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: examend
    spec:
      serviceAccountName: examend
      automountServiceAccountToken: false
      # Above the 25 seconds examend gives its open requests after a stop
      # signal, SHUTDOWN_GRACE, and the preStop sleep before it.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          # The same image as the core; the kustomization pins both.
          image: examend
          args: ["migrate"]
          env:
            - name: EXAMEN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: examen-db
                  key: EXAMEN_DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: examend
          # The placeholder name; the kustomization's images entry names
          # the published image and the release this target runs.
          image: examend
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: examend
          env:
            - name: EXAMEN_ADDR
              value: ":8080"
            - name: EXAMEN_OIDC_ISSUERS
              value: https://auth.latere.ai
            - name: EXAMEN_OIDC_AUDIENCE
              value: examen,api.latere.ai
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/var/run/examend-trust"
            - name: EXAMEN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: examen-db
                  key: EXAMEN_DATABASE_URL
            - name: EXAMEN_DATABASE_POOL_URL
              valueFrom:
                secretKeyRef:
                  name: examen-db
                  key: EXAMEN_DATABASE_POOL_URL
          ports:
            - name: public
              containerPort: 8080
          # Separate on purpose: a database that does not answer takes the
          # Pod out of rotation and does not restart it. Readiness does not
          # read the authorizer, whose outage fails the requests that need
          # it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: public
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: public
            initialDelaySeconds: 10
            periodSeconds: 30
          # A Pod told to stop is still in the Service for the moment its
          # removal takes to reach every proxy; the kubelet's own sleep
          # keeps the listener open through it, since the image has no
          # shell and no sleep.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # The request is what a replica holds at rest; the limits bound a
          # burst of submits and comparisons, each body at most 4 MiB.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: authorizer
              mountPath: /var/run/examen-authorizer
              readOnly: true
            - name: internal-ca
              mountPath: /var/run/examend-trust
              readOnly: true
            - name: keys
              mountPath: /var/run/examen-keys
              readOnly: true
            - name: minter
              mountPath: /var/run/examen-minter
              readOnly: true
      volumes:
        - name: authorizer
          secret:
            secretName: examen-authorizer
            items:
              - key: token
                path: token
        - name: keys
          secret:
            secretName: examen-keys
            items:
              - key: token
                path: token
        - name: minter
          secret:
            secretName: examen-minter
            items:
              - key: token
                path: token
        - name: internal-ca
          secret:
            secretName: platformd-internal-ca
            items:
              - key: ca.crt
                path: platformd-internal-ca.crt
