\* expect violation: Exclusive
\* A run that outlives its hold: a second replica takes the grading the first
\* is still running, and both run it at once.
CONSTANTS
  Gradings = {g1}
  Replicas = {r1, r2}
  Horizon = 60
  Hold <- OverlongHold
  Budget <- OverlongBudget
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Exclusive
