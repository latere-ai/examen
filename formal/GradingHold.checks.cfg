\* A trial's checks: the sandbox's start and the checks' bound within the
\* hold, as the Go constants set them, so no grading is run by two replicas
\* at once. Two holds fit in Horizon minutes.
CONSTANTS
  Gradings = {g1}
  Replicas = {r1, r2}
  Horizon = 60
  Hold <- ChecksHold
  Budget <- ChecksBudget
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Exclusive
