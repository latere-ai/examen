# The release pipeline, on a v* tag, through latere-ai/ci's shared image
# release stages. The build stage requires that the tag's commit passed
# verify, checks the tag and its CHANGELOG section, builds examend for
# linux/amd64 and linux/arm64, pushes it by digest and under no tag, checks
# the candidate reports the version the tag pins, signs it, and gives it a
# bill of materials. Only then does the publish stage tag the digest, sign
# checksums.txt over the bill of materials, and publish the GitHub release
# with the CHANGELOG section as its body. The verify stage then checks the
# published release from a runner with no checkout. GitHub keeps no
# attestations for a private repository on this plan, so the stages skip
# them here.
#
# The image namespace is the repository owner's, so a fork's tag publishes
# under the fork's. Each job is granted only what its stage needs.
#
# Every job runs where the organization's runner policy says (latere-ai/ci,
# README, Runners), the stages' default: for this private repository the
# self-hosted runner, or a hosted one while it is offline. The stages fetch
# the tools the self-hosted runner lacks.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # examend version prints "examend <tag> (<commit>, <date>, schema N)";
      # the " (" keeps v0.8.1 from matching a binary that reports v0.8.10.
      image_1: '{"name": "examend", "version_args": "version", "version_expect": "{name} {tag} ("}'
      # A verify run still going refuses the release at once rather than
      # hold one of the self-hosted runner's two slots while verify queues
      # for the other. Re-run the release once verify is green.
      wait_minutes: "0"

  publish:
    needs: build
    uses: latere-ai/ci/.github/workflows/image-publish.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}

  verify:
    needs: publish
    uses: latere-ai/ci/.github/workflows/release-verify.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: examend
