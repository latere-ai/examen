# The release pipeline, on a v* tag, through latere-ai/ci's shared image
# release stages. The build stage requires that the tag's commit passed
# verify, checks the tag and its CHANGELOG section, builds examend for
# linux/amd64 and linux/arm64, pushes it by digest and under no tag, checks
# the candidate reports the version the tag pins, signs it, and gives it a
# bill of materials. Only then does the publish stage tag the digest, sign
# checksums.txt over the bill of materials, and publish the GitHub release
# with the CHANGELOG section as its body. The verify stage then checks the
# published release from a runner with no checkout, the way SECURITY.md
# tells an installer to. The build stage adds SBOM and provenance
# attestations while the repository is public; GitHub keeps none for a
# private repository on this plan, so the stages skip them there.
#
# Between the build and the publish, a deploy stage rolls Latere's own
# installation, only where the repository variable EXAMEN_RELEASE_DEPLOY is
# set: deploy/prod applied with examend pinned by digest, the Deployment
# waited for, and tools/smoke/release.sh repeated against the live origin.
# The publish stage then appends the smoke evidence to the release body.
#
# The image namespace is the repository owner's, so a fork's tag publishes
# under the fork's. Each job is granted only what its stage needs.
#
# Every job runs on GitHub's hosted runners. Only a maintainer pushes a
# tag, so no fork's code reaches a release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@v1
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # examend version prints "examend <tag> (<commit>, <date>, schema N)";
      # the " (" keeps v0.8.1 from matching a binary that reports v0.8.10.
      image_1: '{"name": "examend", "version_args": "version", "version_expect": "{name} {tag} ("}'
      runs_on: ubuntu-latest

  # The shared deploy stage, under the production environment, so the
  # rollout is a GitHub deployment with a URL on the repository's
  # Deployments page. The repository variable and the kubeconfig secret are
  # set on this repository and on no fork, so a tag on a fork publishes
  # every artifact and skips this job. The image is given by digest, as the
  # overlay's own name for it, because it carries no tag until publish.
  # deploy/prod holds only re-appliable manifests; deploy/bootstrap is never
  # read.
  deploy:
    name: deploy and smoke
    # build is named for its outputs: a job reads the outputs of the jobs it
    # needs directly, and of no other. No other job proves the image before
    # release, so the build stage's own checks are the gate.
    needs: build
    if: ${{ vars.EXAMEN_RELEASE_DEPLOY != '' }}
    uses: latere-ai/ci/.github/workflows/image-deploy.yml@v1
    permissions:
      contents: read
    with:
      images: examend=${{ needs.build.outputs.ref_1 }}@${{ needs.build.outputs.digest_1 }}
      deployments: |
        examend
      url: https://api.latere.ai/v1/evals
    secrets:
      DEPLOY_KUBECONFIG: ${{ secrets.EXAMEN_KUBECONFIG }}

  publish:
    needs: [build, deploy]
    # deploy is skipped on every repository that sets no EXAMEN_RELEASE_DEPLOY,
    # and a job that leans on the implicit success() is skipped whenever a
    # job above it in the graph is, so each result is named here.
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    uses: latere-ai/ci/.github/workflows/image-publish.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      # The smoke evidence is the run artifact the deploy stage uploads. A
      # release whose deploy was skipped has none, and the publish stage
      # refuses an evidence pattern that names no file, so it is named only
      # when the deploy ran.
      evidence: ${{ needs.deploy.result == 'success' && 'smoke-evidence' || '' }}
      runs_on: ubuntu-latest

  verify:
    needs: publish
    # deploy sits above this job in the graph and is skipped on a fork, so
    # the result this job waits on is named, as on publish.
    if: ${{ always() && needs.publish.result == 'success' }}
    uses: latere-ai/ci/.github/workflows/release-verify.yml@v1
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: examend
      runs_on: ubuntu-latest
