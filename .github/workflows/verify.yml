# Every push to main and every pull request runs the gate, the shared
# pipeline of latere-ai/ci, which also runs tidy, actionlint and the image
# build, version, size and shell checks, and the one check that needs a
# Postgres the gate does not bring up: a server image that migrates a
# database, then starts and answers. Every third-party action is pinned by
# commit.
#
# A push or pull request that changes only specs or markdown starts no run,
# because no build or test reads them. The exceptions are the four specs
# whose tables the suite holds the code to, so a change to one of them runs
# everything. `lateregate release` runs the whole bar, the spec tree
# included, before every tag, and release.yml reads past the commits this
# skips. A tag is never filtered by paths.
name: verify
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "specs/002-objects.md"
      - "specs/003-api.md"
      - "specs/004-identity-and-authorization.md"
      - "specs/011-distribution.md"
  pull_request:
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "specs/002-objects.md"
      - "specs/003-api.md"
      - "specs/004-identity-and-authorization.md"
      - "specs/011-distribution.md"
  workflow_dispatch:

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner is better spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job runs where the organization's runner policy says (latere-ai/ci,
  # README, Runners). While the repository is public, a pull request, a
  # fork's among them, runs on a hosted runner and never on the
  # organization's self-hosted one, and a push to main runs on a hosted
  # runner too, or on the self-hosted runner while hosted runners are down.
  # While it is private, every job runs on the self-hosted runner, which
  # carries Docker, git, jq and curl, or on a hosted one while it is offline
  # or busy. No job reads a secret.
  gate:
    if: "!startsWith(github.ref, 'refs/tags/')"
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1

  # The server image on every push migrates a database and then starts and
  # answers with a read-only root file system and no capability. The gate
  # builds the image and checks its version, size and shell, but cannot
  # start it without a Postgres. Every name carries the run, since two jobs
  # may share the runner's engine at once.
  image:
    name: the server image migrates a database, then starts and answers
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ${{ (github.event.repository.private || contains(fromJSON('["push","schedule","workflow_dispatch","release"]'), github.event_name)) && (vars.CI_RUNNER_PRIVATE || vars.CI_RUNNER_PUBLIC) || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      NAME: examen-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t "${NAME}:candidate" .
      - name: The image migrates a database, then starts and answers with a read-only root file system
        # An issuer that is never asked: the probes need no token, and an
        # issuer that does not answer at start is named and the server
        # starts.
        run: |
          docker network create "${NAME}" > /dev/null
          docker run -d --name "${NAME}-db" --network "${NAME}" \
            -e POSTGRES_USER=examen -e POSTGRES_PASSWORD=examen -e POSTGRES_DB=examen \
            docker.io/library/postgres:16-alpine > /dev/null
          # Over TCP, so the server the image's own setup runs first, which
          # listens on its socket alone, does not count as ready.
          for _ in $(seq 1 60); do
            docker exec "${NAME}-db" pg_isready -h 127.0.0.1 -U examen -d examen > /dev/null 2>&1 && break
            sleep 1
          done
          url="postgres://examen:examen@${NAME}-db:5432/examen?sslmode=disable"
          docker run --rm --network "${NAME}" --read-only --cap-drop ALL \
            -e EXAMEN_DATABASE_URL="${url}" "${NAME}:candidate" migrate
          docker run -d --name "${NAME}-serve" --network "${NAME}" --read-only --cap-drop ALL \
            -e EXAMEN_DATABASE_URL="${url}" -e EXAMEN_OIDC_ISSUERS=https://issuer.example.com \
            -p 127.0.0.1::8080 "${NAME}:candidate" serve > /dev/null
          port=$(docker port "${NAME}-serve" 8080/tcp | head -n1 | sed 's/.*://')
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${port}/readyz" > /dev/null; then
              echo "the server answers"; exit 0
            fi
            sleep 0.5
          done
          docker logs "${NAME}-serve"
          echo "the server did not answer" >&2; exit 1
      - name: Remove what the job started
        if: always()
        run: |
          docker rm -f "${NAME}-serve" "${NAME}-db" > /dev/null 2>&1 || true
          docker network rm "${NAME}" > /dev/null 2>&1 || true
          docker image rm "${NAME}:candidate" > /dev/null 2>&1 || true
