name: Bug report
description: Something Examen does that it should not, or does not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. See
        [SECURITY.md](https://github.com/latere-ai/examen/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I submitted ten trials of each candidate and the comparison's suite-level result said ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The shortest sequence that shows it: the objects you applied, the
        requests you sent, and the answer with its error code. Redact
        tokens and keys.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or image digest, from `GET /version` or `examend version`.
      placeholder: v0.8.2
    validations:
      required: true

  - type: dropdown
    id: candidates
    attributes:
      label: How the trials ran
      multiple: true
      options:
        - An external harness leasing and submitting trials
        - Imported past runs
        - Topos sessions (candidates of kind topos)
        - Not about running trials
    validations:
      required: true

  - type: dropdown
    id: store
    attributes:
      label: Database
      options:
        - Postgres
        - Postgres through a pooler
    validations:
      required: true

  - type: dropdown
    id: decides
    attributes:
      label: Who decides
      description: The `decides` line of examend's start log.
      options:
        - An authorizer
        - The owner policy
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant lines from examend's log, including its start lines.
        Redact tokens and hostnames you would rather not publish.
      render: text
